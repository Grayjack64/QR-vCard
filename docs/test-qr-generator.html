<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vCard QR Code Generator for Testing</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1, h2 {
            color: #2196F3;
        }
        .qr-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .qr-card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 15px;
            width: 250px;
            margin-bottom: 20px;
            text-align: center;
        }
        .qr-code {
            margin: 10px auto;
        }
        .contact-details {
            margin-top: 15px;
            text-align: left;
            font-size: 14px;
        }
        .contact-details p {
            margin: 5px 0;
        }
        .name {
            font-weight: bold;
            font-size: 16px;
            color: #333;
        }
        .controls {
            margin: 20px 0;
            padding: 15px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #0b7dda;
        }
        .download-all {
            background-color: #4CAF50;
        }
        input[type="number"] {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 60px;
        }
    </style>
</head>
<body>
    <h1>vCard QR Code Generator for Testing</h1>
    
    <div class="controls">
        <h2>Generate Test QR Codes</h2>
        <p>Create QR codes with mock vCard data for testing your QR scanner.</p>
        
        <div>
            <label for="count">Number of QR codes:</label>
            <input type="number" id="count" min="1" max="20" value="5">
            <button onclick="generateQRCodes()">Generate QR Codes</button>
            <button class="download-all" onclick="downloadAllQRCodes()">Download All QR Codes</button>
        </div>
    </div>
    
    <div id="qrContainer" class="qr-container"></div>
    
    <script>
        // Mock data for generating random contacts
        const firstNames = ['John', 'Jane', 'Michael', 'Emily', 'David', 'Sarah', 'James', 'Emma', 
                            'Daniel', 'Olivia', 'Sophia', 'William', 'Alex', 'Sam', 'Robert', 'Lisa'];
        const lastNames = ['Smith', 'Johnson', 'Williams', 'Brown', 'Jones', 'Miller', 'Davis', 'Garcia', 
                           'Rodriguez', 'Wilson', 'Martinez', 'Anderson', 'Taylor', 'Thomas', 'Moore', 'Lee'];
        const companies = ['Acme Inc.', 'TechCorp', 'InnoSys', 'Global Solutions', 'Apex Partners', 
                          'Bright Future LLC', 'Strategic Dynamics', 'Horizon Group', 'Precision Tech',
                          'Summit Enterprises', 'Prosper Show', 'Quantum Solutions', 'Prime Consulting'];
        const titles = ['CEO', 'CTO', 'Marketing Manager', 'Sales Director', 'Product Manager', 
                       'Software Engineer', 'UX Designer', 'Financial Analyst', 'Operations Manager',
                       'HR Specialist', 'Business Analyst', 'Data Scientist', 'Account Executive'];
        const domains = ['gmail.com', 'yahoo.com', 'outlook.com', 'company.com', 'example.org', 
                        'business.net', 'techmail.com', 'protonmail.com', 'mail.org', 'corporation.com'];
        
        // Generate random mock data
        function generateMockContact() {
            const firstName = firstNames[Math.floor(Math.random() * firstNames.length)];
            const lastName = lastNames[Math.floor(Math.random() * lastNames.length)];
            const company = companies[Math.floor(Math.random() * companies.length)];
            const title = titles[Math.floor(Math.random() * titles.length)];
            const domain = domains[Math.floor(Math.random() * domains.length)];
            
            const email = `${firstName.toLowerCase()}.${lastName.toLowerCase()}@${domain}`;
            const phoneNumber = `+1${Math.floor(Math.random() * 900 + 100)}${Math.floor(Math.random() * 900 + 100)}${Math.floor(Math.random() * 9000 + 1000)}`;
            const website = `https://www.${company.toLowerCase().replace(/\s+/g, '')}.com`;
            
            return {
                firstName,
                lastName,
                fullName: `${firstName} ${lastName}`,
                company,
                title,
                email,
                phoneNumber,
                website
            };
        }
        
        // Create vCard format string
        function createVCardString(contact) {
            return `BEGIN:VCARD
VERSION:3.0
N:${contact.lastName};${contact.firstName};;;
FN:${contact.fullName}
ORG:${contact.company}
TITLE:${contact.title}
TEL;type=CELL:${contact.phoneNumber}
EMAIL:${contact.email}
URL:${contact.website}
END:VCARD`;
        }
        
        // Generate QR codes with mock data
        function generateQRCodes() {
            const count = document.getElementById('count').value;
            const container = document.getElementById('qrContainer');
            container.innerHTML = '';
            
            for (let i = 0; i < count; i++) {
                const contact = generateMockContact();
                const vCardString = createVCardString(contact);
                
                const card = document.createElement('div');
                card.className = 'qr-card';
                
                const canvas = document.createElement('canvas');
                canvas.className = 'qr-code';
                canvas.id = `qr-code-${i}`;
                
                const details = document.createElement('div');
                details.className = 'contact-details';
                
                details.innerHTML = `
                    <p class="name">${contact.fullName}</p>
                    <p>${contact.title}</p>
                    <p>${contact.company}</p>
                    <p>${contact.phoneNumber}</p>
                    <p>${contact.email}</p>
                `;
                
                const downloadBtn = document.createElement('button');
                downloadBtn.innerText = 'Download QR';
                downloadBtn.onclick = function() {
                    downloadQRCode(canvas, contact.fullName);
                };
                
                card.appendChild(canvas);
                card.appendChild(details);
                card.appendChild(downloadBtn);
                container.appendChild(card);
                
                QRCode.toCanvas(canvas, vCardString, {
                    width: 200,
                    margin: 1,
                    color: {
                        dark: '#000000',
                        light: '#ffffff'
                    }
                });
            }
        }
        
        // Download a single QR code
        function downloadQRCode(canvas, name) {
            const link = document.createElement('a');
            link.download = `vcard-qr-${name.replace(/\s+/g, '-').toLowerCase()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        // Download all QR codes as separate files
        function downloadAllQRCodes() {
            const canvases = document.querySelectorAll('.qr-code');
            canvases.forEach((canvas, index) => {
                const name = document.querySelectorAll('.name')[index].innerText;
                setTimeout(() => {
                    downloadQRCode(canvas, name);
                }, index * 500); // Add delay to avoid browser blocking multiple downloads
            });
        }
        
        // Generate initial QR codes on page load
        window.onload = generateQRCodes;
    </script>
</body>
</html>

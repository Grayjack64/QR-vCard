<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/QR-vCard/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A Progressive Web App for generating and scanning vCard QR codes for the Prosper Show.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Prosper Show QR vCard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Camera permissions meta tags -->
  <meta name="permissions-policy" content="camera=*, microphone=*">
  <meta http-equiv="origin-trial" content="">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Prosper Show QR vCard</title>
  <link rel="manifest" href="manifest.json">

  <!-- PWA specific meta tags -->
  <meta name="theme-color" content="#2196F3">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Add jsQR library for QR scanning -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  
  <!-- Add a fallback in case CDN fails -->
  <script>
    // Check if jsQR loaded
    if (typeof jsQR !== 'function') {
      console.error('jsQR library failed to load from CDN, attempting to load from fallback');
      // Create a new script element
      var jsQRScript = document.createElement('script');
      jsQRScript.src = 'https://unpkg.com/jsqr@1.4.0/dist/jsQR.min.js';
      jsQRScript.async = false;
      document.head.appendChild(jsQRScript);
    }
  </script>
  
  <style>
    body {
      background-color: #f5f5f5;
    }
    
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #f5f5f5;
    }
    
    .loader {
      border: 8px solid #f3f3f3;
      border-radius: 50%;
      border-top: 8px solid #2196F3;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #cameraDebug {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px;
      font-family: monospace;
      z-index: 9999;
      max-height: 30vh;
      overflow-y: auto;
      display: none; /* Hide by default */
      font-size: 10px; /* Smaller text to not block UI */
      opacity: 0.8; /* Semi-transparent */
    }
    
    #debugToggle {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }
    
    #qrScannerContainer {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1000;
      background-color: #000;
    }
    
    #qrScannerVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    #qrScannerCanvas {
      display: none;
    }
    
    .scanner-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    
    .scanner-frame {
      width: 250px;
      height: 250px;
      border: 2px solid #fff;
      border-radius: 10px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
    }
    
    .scanner-instructions {
      color: white;
      margin-top: 20px;
      text-align: center;
      padding: 0 20px;
    }
    
    .scanner-close {
      position: absolute;
      top: 20px;
      right: 20px;
      color: white;
      background: rgba(0, 0, 0, 0.5);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
    }
    
    #directTestBtn {
      position: fixed;
      top: 60px;
      right: 10px;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 14px;
      z-index: 10000;
      cursor: pointer;
    }
    
    /* Make debug visible by default */
    #cameraDebug {
      display: block !important;
      opacity: 1 !important;
      max-height: 40vh !important;
      font-size: 12px !important;
    }
  </style>
</head>
<body>
  <!-- Loading indicator -->
  <div class="loading" id="loading">
    <div class="loader"></div>
  </div>

  <!-- Camera debug overlay (visible by default now) -->
  <div id="cameraDebug" style="display: block;"></div>
  
  <!-- Debug toggle button -->
  <button id="debugToggle">🐞</button>
  
  <!-- Direct test button (bypasses Flutter) -->
  <button id="directTestBtn">Test Camera Directly</button>
  
  <!-- QR Scanner Container -->
  <div id="qrScannerContainer">
    <video id="qrScannerVideo" playsinline></video>
    <canvas id="qrScannerCanvas"></canvas>
    <div class="scanner-overlay">
      <div class="scanner-frame"></div>
      <div class="scanner-instructions">Position the QR code within the frame to scan</div>
    </div>
    <button class="scanner-close" id="qrScannerClose">✕</button>
  </div>
  
  <script>
    // Debug toggle flag - ON by default
    let debugVisible = true;
    
    // Debug logging function
    function logDebug(message, isError = false) {
      console.log(message);
      
      const debugElement = document.getElementById('cameraDebug');
      if (debugElement) {
        const logLine = document.createElement('div');
        logLine.textContent = message;
        
        // Style errors differently
        if (isError) {
          logLine.style.color = '#ff6b6b';
          logLine.style.fontWeight = 'bold';
        }
        
        debugElement.appendChild(logLine);
        // Scroll to bottom
        debugElement.scrollTop = debugElement.scrollHeight;
      }
    }

    // Function to log errors
    function logError(message) {
      console.error(message);
      logDebug(`ERROR: ${message}`, true);
    }

    // Add some immediate debug info
    logDebug('🔍 DEBUG ENABLED - Page loading...');
    logDebug('User Agent: ' + navigator.userAgent);
    
    // Log browser capabilities
    logDebug('Browser capabilities check:');
    logDebug('- navigator.mediaDevices: ' + (navigator.mediaDevices ? 'Available ✅' : 'Not available ❌'));
    logDebug('- getUserMedia: ' + (navigator.mediaDevices?.getUserMedia ? 'Available ✅' : 'Not available ❌'));
    logDebug('- jsQR loaded: ' + (typeof jsQR === 'function' ? 'Yes ✅' : 'No ❌'));
    
    // Handle direct test button
    document.getElementById('directTestBtn').addEventListener('click', function() {
      logDebug('📸 Direct camera test requested');
      try {
        window.webQRScanner.start(function(result) {
          logDebug('QR code detected: ' + result.substring(0, 30) + '...');
        });
      } catch (e) {
        logError('Error in direct test: ' + e.message);
      }
    });
    
    // Show available cameras
    async function listCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cameras = devices.filter(device => device.kind === 'videoinput');
        logDebug(`Found ${cameras.length} cameras:`);
        cameras.forEach((camera, index) => {
          logDebug(`${index+1}: ${camera.label || 'Unnamed camera'}`);
        });
        return cameras;
      } catch (err) {
        logError(`Error listing cameras: ${err.message}`);
        return [];
      }
    }

    // Request camera permission with specific constraints
    async function requestCamera() {
      logDebug('Requesting camera permission...');
      try {
        // Try to get the back camera if available
        const cameras = await listCameras();
        let constraints = { 
          video: { 
            facingMode: 'environment',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          } 
        };

        // If we have a back camera, try to use it specifically
        if (cameras.length > 1) {
          // Typically the back camera is listed second
          const backCamera = cameras[cameras.length > 1 ? 1 : 0];
          logDebug(`Trying to use camera: ${backCamera.label || 'Unnamed camera'}`);
          constraints = {
            video: {
              deviceId: { exact: backCamera.deviceId },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          };
        }

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        logDebug('Camera permission granted!');
        
        // Stop the stream immediately
        stream.getTracks().forEach(track => {
          logDebug(`Stopping track: ${track.kind}`);
          track.stop();
        });
        
        return true;
      } catch (error) {
        logError(`Camera permission error: ${error.name} - ${error.message}`);
        return false;
      }
    }
    
    // Web QR Scanner Implementation
    class WebQRScanner {
      constructor() {
        this.video = document.getElementById('qrScannerVideo');
        this.canvas = document.getElementById('qrScannerCanvas');
        this.container = document.getElementById('qrScannerContainer');
        this.closeButton = document.getElementById('qrScannerClose');
        this.ctx = this.canvas.getContext('2d');
        this.stream = null;
        this.scanning = false;
        this.onDetectedCallback = null;
        
        // Set up close button
        this.closeButton.addEventListener('click', () => this.close());
      }
      
      async start(callback) {
        logDebug('Starting web QR scanner');
        this.onDetectedCallback = callback;
        
        try {
          // Verify DOM elements
          if (!this.video || !this.canvas || !this.container) {
            logError('QR Scanner DOM elements not found');
            return false;
          }
          
          // Get camera stream
          logDebug('Requesting camera access...');
          const constraints = { 
            video: { 
              facingMode: 'environment',
              width: { ideal: 1280 },
              height: { ideal: 720 }
            },
            audio: false
          };
          
          try {
            this.stream = await navigator.mediaDevices.getUserMedia(constraints);
            logDebug('Camera access granted!');
          } catch (cameraError) {
            logError(`Camera access denied: ${cameraError.name} - ${cameraError.message}`);
            
            // Try a simpler approach as fallback
            logDebug('Trying fallback camera access...');
            try {
              this.stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
              logDebug('Fallback camera access granted!');
            } catch (fallbackError) {
              logError(`Fallback camera access failed: ${fallbackError.message}`);
              return false;
            }
          }
          
          // Set video source
          this.video.srcObject = this.stream;
          this.video.setAttribute('playsinline', true);
          this.video.setAttribute('autoplay', true);
          
          logDebug('Video element configured, waiting for metadata...');
          
          // Wait for video to be ready
          await new Promise((resolve, reject) => {
            this.video.onloadedmetadata = () => {
              logDebug('Video metadata loaded');
              resolve();
            };
            this.video.onerror = (e) => {
              logError(`Video error: ${e}`);
              reject(new Error('Video loading failed'));
            };
            // Add a timeout
            setTimeout(() => {
              if (this.video.readyState === 0) {
                logError('Video metadata loading timeout');
                reject(new Error('Video metadata loading timeout'));
              }
            }, 5000);
          });
          
          logDebug('Playing video...');
          try {
            await this.video.play();
            logDebug('Video playing!');
          } catch (playError) {
            logError(`Video play error: ${playError.message}`);
            return false;
          }
          
          // Set canvas dimensions
          this.canvas.width = this.video.videoWidth || 640;
          this.canvas.height = this.video.videoHeight || 480;
          
          logDebug(`Canvas size set to ${this.canvas.width}x${this.canvas.height}`);
          
          // Show scanner
          this.container.style.display = 'block';
          
          // Start scanning
          this.scanning = true;
          this.scanQRCode();
          
          logDebug('Web QR scanner started successfully');
          return true;
        } catch (error) {
          logError(`Web QR scanner error: ${error.message}`);
          return false;
        }
      }
      
      scanQRCode() {
        if (!this.scanning) return;
        
        try {
          // Check if video is ready
          if (!this.video.videoWidth || !this.video.videoHeight) {
            logDebug('Video not ready yet, retrying in 500ms...');
            setTimeout(() => this.scanQRCode(), 500);
            return;
          }
          
          // Draw video frame to canvas
          this.ctx.drawImage(this.video, 0, 0, this.canvas.width, this.canvas.height);
          
          // Get image data
          const imageData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
          
          // Check if jsQR is available
          if (typeof jsQR !== 'function') {
            logError('jsQR not available for scanning');
            setTimeout(() => this.scanQRCode(), 1000);
            return;
          }
          
          // Scan for QR code
          const code = jsQR(imageData.data, imageData.width, imageData.height, {
            inversionAttempts: "dontInvert",
          });
          
          if (code && code.data) {
            logDebug(`QR code detected: ${code.data.substring(0, 30)}...`);
            
            // Check if it's a vCard
            if (code.data.includes('BEGIN:VCARD') && code.data.includes('END:VCARD')) {
              logDebug('Valid vCard QR code detected!');
              // Call callback with result
              if (this.onDetectedCallback) {
                this.onDetectedCallback(code.data);
              }
              
              // Stop scanning
              this.close();
              return;
            } else {
              logDebug('QR code does not contain vCard data, continuing scan...');
            }
          }
          
          // Continue scanning
          requestAnimationFrame(() => this.scanQRCode());
        } catch (error) {
          logError(`Error in QR scanning: ${error.message}`);
          // Try to continue scanning despite error
          setTimeout(() => this.scanQRCode(), 1000);
        }
      }
      
      close() {
        logDebug('Closing web QR scanner');
        this.scanning = false;
        
        // Hide scanner
        this.container.style.display = 'none';
        
        // Stop video stream
        if (this.stream) {
          this.stream.getTracks().forEach(track => track.stop());
          this.stream = null;
        }
      }
    }
    
    // Create global scanner instance
    window.webQRScanner = new WebQRScanner();
    
    // Function to start scanning (called from Flutter)
    window.startQRScanner = function() {
      // Always show debug when starting scanner
      debugVisible = true;
      document.getElementById('cameraDebug').style.display = 'block';
      
      logDebug('==== QR SCANNER STARTING ====');
      logDebug('Navigator: ' + navigator.userAgent);
      
      try {
        // Check if jsQR is available
        if (typeof jsQR !== 'function') {
          logError('jsQR library not loaded!');
          return false;
        }
        
        // Check if MediaDevices API is available
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          logError('MediaDevices API not available in this browser');
          return false;
        }
        
        logDebug('Starting QR scanner with WebQRScanner instance');
        return window.webQRScanner.start((result) => {
          logDebug('QR code detected: ' + result.substring(0, 30) + '...');
          // Send result back to Flutter
          if (window.flutter_inappwebview) {
            window.flutter_inappwebview.callHandler('onQRCodeDetected', result);
          } else {
            // For standard Flutter web
            if (typeof window.onQRCodeDetected === 'function') {
              window.onQRCodeDetected(result);
            } else {
              logError('onQRCodeDetected function not found!');
            }
          }
        });
      } catch (e) {
        logError('Error starting QR scanner: ' + e.message);
        return false;
      }
    };

    // Initialize when page loads
    window.addEventListener('load', async function() {
      logDebug('Page loaded, initializing camera...');
      await requestCamera();
      
      // Set a global flag that Flutter can check
      window.cameraPermissionRequested = true;
    });
    
    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js?v=509960650')
          .then(reg => logDebug('Service worker registered'))
          .catch(err => logError(`Service worker error: ${err.message}`));
      });
    }
    
    // Hide loading indicator when app is loaded
    window.addEventListener('flutter-first-frame', function() {
      logDebug('Flutter app initialized');
      var loadingIndicator = document.getElementById('loading');
      if (loadingIndicator) {
        loadingIndicator.remove();
      }
    });

    // Setup debug toggle button
    document.getElementById('debugToggle').addEventListener('click', function() {
      const debugElement = document.getElementById('cameraDebug');
      debugVisible = !debugVisible;
      if (debugElement) {
        debugElement.style.display = debugVisible ? 'block' : 'none';
      }
    });
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

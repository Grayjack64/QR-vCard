<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/QR-vCard/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A Progressive Web App for generating and scanning vCard QR codes for the Prosper Show.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Prosper Show QR vCard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Prosper Show QR vCard</title>
  <link rel="manifest" href="manifest.json">

  <!-- PWA specific meta tags -->
  <meta name="theme-color" content="#2196F3">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- QR Code Scanner Library -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  
  <style>
    body {
      background-color: #f5f5f5;
    }
    
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #f5f5f5;
    }
    
    .loader {
      border: 8px solid #f3f3f3;
      border-radius: 50%;
      border-top: 8px solid #2196F3;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Loading indicator -->
  <div class="loading" id="loading">
    <div class="loader"></div>
  </div>
  
  <script>
    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js?v=85075603');
      });
    }
    
    // Hide loading indicator when app is loaded
    window.addEventListener('flutter-first-frame', function() {
      var loadingIndicator = document.getElementById('loading');
      if (loadingIndicator) {
        loadingIndicator.remove();
      }
    });
    
    // QR Scanner Implementation
    window.webQRScanner = {
      scanner: null,
      start: function(callback) {
        console.log("Starting web QR scanner...");
        try {
          // Create HTML elements for camera
          var videoElement = document.getElementById('qr-video');
          if (!videoElement) {
            var scannerContainer = document.createElement('div');
            scannerContainer.id = 'scanner-container';
            scannerContainer.style.width = '100%';
            scannerContainer.style.height = '100%';
            scannerContainer.style.display = 'flex';
            scannerContainer.style.position = 'absolute';
            scannerContainer.style.top = '0';
            scannerContainer.style.left = '0';
            scannerContainer.style.backgroundColor = 'black';
            scannerContainer.style.zIndex = '999';
            
            videoElement = document.createElement('video');
            videoElement.id = 'qr-video';
            videoElement.style.width = '100%';
            videoElement.style.height = '100%';
            videoElement.style.objectFit = 'cover';
            
            scannerContainer.appendChild(videoElement);
            document.body.appendChild(scannerContainer);
          }
          
          // Start camera
          navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' }
          }).then(function(stream) {
            videoElement.srcObject = stream;
            videoElement.play();
            
            // Setup canvas and context for scanning
            var canvas = document.createElement('canvas');
            var context = canvas.getContext('2d');
            var scanning = true;
            
            // Scan function
            var scan = function() {
              if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA && scanning) {
                canvas.height = videoElement.videoHeight;
                canvas.width = videoElement.videoWidth;
                context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                
                try {
                  var imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                  var code = jsQR(imageData.data, imageData.width, imageData.height);
                  
                  if (code && code.data) {
                    console.log("QR Code found:", code.data.substring(0, 50) + "...");
                    callback(code.data);
                    scanning = false;
                    
                    // Stop the camera
                    var stream = videoElement.srcObject;
                    var tracks = stream.getTracks();
                    tracks.forEach(function(track) {
                      track.stop();
                    });
                    
                    // Remove scanner container after a delay
                    setTimeout(function() {
                      if (document.getElementById('scanner-container')) {
                        document.getElementById('scanner-container').remove();
                      }
                    }, 500);
                  }
                } catch (e) {
                  console.error("Scanning error:", e);
                }
                
                if (scanning) {
                  requestAnimationFrame(scan);
                }
              } else {
                requestAnimationFrame(scan);
              }
            };
            
            // Start scanning
            requestAnimationFrame(scan);
            
            console.log("Camera started successfully");
          }).catch(function(error) {
            console.error("Camera access error:", error);
            if (document.getElementById('scanner-container')) {
              document.getElementById('scanner-container').remove();
            }
            
            // Notify Flutter about the error
            if (window.onQRScannerError) {
              window.onQRScannerError("Camera access denied: " + error.message);
            }
          });
        } catch (e) {
          console.error("Scanner initialization error:", e);
          if (window.onQRScannerError) {
            window.onQRScannerError("Scanner initialization error: " + e.message);
          }
        }
      },
      stop: function() {
        var videoElement = document.getElementById('qr-video');
        if (videoElement && videoElement.srcObject) {
          var stream = videoElement.srcObject;
          var tracks = stream.getTracks();
          tracks.forEach(function(track) {
            track.stop();
          });
        }
        
        if (document.getElementById('scanner-container')) {
          document.getElementById('scanner-container').remove();
        }
      }
    };
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

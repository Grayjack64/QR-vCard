<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standalone QR Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f5f5f5;
        }
        
        header {
            background-color: #2196F3;
            color: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        h1 {
            margin: 0;
            font-size: 24px;
        }
        
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        #scanner-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        #video {
            width: 100%;
            height: auto;
            background-color: #000;
        }
        
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .scan-region {
            width: 250px;
            height: 250px;
            border: 2px solid #2196F3;
            border-radius: 8px;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
        }
        
        #controls {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        button {
            padding: 10px 20px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        
        button:hover {
            background-color: #0b7dda;
        }
        
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        
        #result-container {
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 20px;
            display: none;
        }
        
        #result-container.visible {
            display: block;
        }
        
        #vcard-display {
            white-space: pre-wrap;
            word-break: break-all;
            font-family: monospace;
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 14px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .contact-info {
            margin-top: 20px;
        }
        
        .contact-info div {
            margin: 5px 0;
        }
        
        .field-name {
            font-weight: bold;
            color: #666;
        }
        
        .status-message {
            margin: 10px 0;
            padding: 10px;
            background-color: #e8f4fd;
            border-radius: 4px;
            text-align: center;
        }
        
        .error-message {
            background-color: #ffebee;
            color: #c62828;
        }
        
        #canvas {
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Standalone QR Scanner</h1>
    </header>
    
    <main>
        <div id="scanner-container">
            <video id="video" playsinline></video>
            <canvas id="canvas"></canvas>
            <div id="overlay">
                <div class="scan-region"></div>
            </div>
        </div>
        
        <div id="controls">
            <button id="start-camera">Start Camera</button>
            <button id="switch-camera" disabled>Switch Camera</button>
        </div>
        
        <div id="status" class="status-message">Press "Start Camera" to begin scanning</div>
        
        <div id="result-container">
            <h2>Scanned vCard</h2>
            <div class="contact-info" id="contact-info"></div>
            <h3>Raw vCard Data:</h3>
            <div id="vcard-display"></div>
            <button id="scan-new" style="margin-top: 15px;">Scan Another</button>
        </div>
    </main>
    
    <script>
        // DOM Elements
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startButton = document.getElementById('start-camera');
        const switchButton = document.getElementById('switch-camera');
        const statusElement = document.getElementById('status');
        const resultContainer = document.getElementById('result-container');
        const vcardDisplay = document.getElementById('vcard-display');
        const contactInfo = document.getElementById('contact-info');
        const scanNewButton = document.getElementById('scan-new');
        
        // Variables
        let streaming = false;
        let currentStream = null;
        let canvasContext = canvas.getContext('2d');
        let facingMode = 'environment'; // Start with back camera
        
        // Start camera when button is clicked
        startButton.addEventListener('click', startCamera);
        switchButton.addEventListener('click', switchCamera);
        scanNewButton.addEventListener('click', resetScanner);
        
        // Check for camera support
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            updateStatus('Camera access is not supported in this browser', true);
            startButton.disabled = true;
        }
        
        // Start the camera
        async function startCamera() {
            try {
                // First, check what cameras are available
                const devices = await navigator.mediaDevices.enumerateDevices();
                const cameras = devices.filter(device => device.kind === 'videoinput');
                console.log(`Found ${cameras.length} cameras`);
                
                // Enable switch camera button if more than one camera available
                if (cameras.length > 1) {
                    switchButton.disabled = false;
                }
                
                // Request camera stream
                const constraints = {
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                };
                
                // Stop any existing stream
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
                
                // Get new stream
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                
                // Wait for video to be ready
                video.onloadedmetadata = () => {
                    streaming = true;
                    startButton.disabled = true;
                    updateStatus('Camera active - scan a vCard QR code');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    // Start playing the video
                    video.play();
                    
                    // Start scanning for QR codes
                    scanQRCode();
                };
            } catch (error) {
                console.error('Error starting camera:', error);
                updateStatus(`Camera error: ${error.message}`, true);
            }
        }
        
        // Switch between front and back cameras
        function switchCamera() {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            startCamera();
        }
        
        // Scan for QR codes
        function scanQRCode() {
            if (!streaming) return;
            
            try {
                // Draw current video frame to canvas
                canvasContext.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Get image data for QR code detection
                const imageData = canvasContext.getImageData(0, 0, canvas.width, canvas.height);
                
                // Check if jsQR library is available
                if (typeof jsQR === 'function') {
                    // Process image to find QR code
                    const code = jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: "dontInvert",
                    });
                    
                    if (code && code.data) {
                        console.log('QR code detected:', code.data.substring(0, 30) + '...');
                        
                        // Check if it's a vCard
                        if (code.data.includes('BEGIN:VCARD') && code.data.includes('END:VCARD')) {
                            // Stop scanning
                            streaming = false;
                            
                            // Display the vCard data
                            displayVCardData(code.data);
                            
                            // Stop camera
                            if (currentStream) {
                                currentStream.getTracks().forEach(track => track.stop());
                            }
                            
                            return;
                        }
                    }
                } else {
                    updateStatus('QR code scanner library not loaded correctly', true);
                    streaming = false;
                    return;
                }
                
                // Continue scanning
                requestAnimationFrame(scanQRCode);
            } catch (error) {
                console.error('Error scanning QR code:', error);
                updateStatus(`Scan error: ${error.message}`, true);
                setTimeout(() => requestAnimationFrame(scanQRCode), 1000);
            }
        }
        
        // Display vCard data
        function displayVCardData(vcardString) {
            // Show result container
            resultContainer.classList.add('visible');
            
            // Display raw vCard
            vcardDisplay.textContent = vcardString;
            
            // Parse and display formatted contact info
            const parsedContact = parseVCard(vcardString);
            
            let infoHTML = '';
            
            if (parsedContact.fullName) {
                infoHTML += `<div><span class="field-name">Name:</span> ${parsedContact.fullName}</div>`;
            }
            
            if (parsedContact.organization) {
                infoHTML += `<div><span class="field-name">Organization:</span> ${parsedContact.organization}</div>`;
            }
            
            if (parsedContact.title) {
                infoHTML += `<div><span class="field-name">Title:</span> ${parsedContact.title}</div>`;
            }
            
            if (parsedContact.phone) {
                infoHTML += `<div><span class="field-name">Phone:</span> ${parsedContact.phone}</div>`;
            }
            
            if (parsedContact.email) {
                infoHTML += `<div><span class="field-name">Email:</span> ${parsedContact.email}</div>`;
            }
            
            if (parsedContact.url) {
                infoHTML += `<div><span class="field-name">Website:</span> ${parsedContact.url}</div>`;
            }
            
            if (parsedContact.address) {
                infoHTML += `<div><span class="field-name">Address:</span> ${parsedContact.address}</div>`;
            }
            
            contactInfo.innerHTML = infoHTML;
            
            // Update status
            updateStatus('vCard QR code successfully scanned!');
        }
        
        // Parse vCard string into object
        function parseVCard(vcardString) {
            const result = {};
            
            // Split into lines
            const lines = vcardString.split(/\r\n|\r|\n/);
            
            // Parse each line
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                // Skip empty lines and BEGIN/END markers
                if (!line || line === 'BEGIN:VCARD' || line === 'END:VCARD') {
                    continue;
                }
                
                // Split into key and value
                const colonIndex = line.indexOf(':');
                if (colonIndex > 0) {
                    const key = line.substring(0, colonIndex).toUpperCase();
                    const value = line.substring(colonIndex + 1);
                    
                    // Extract common fields
                    switch (key) {
                        case 'FN':
                            result.fullName = value;
                            break;
                        case 'ORG':
                            result.organization = value;
                            break;
                        case 'TITLE':
                            result.title = value;
                            break;
                        case 'TEL':
                        case 'TEL;TYPE=CELL':
                        case 'TEL;TYPE=WORK':
                        case 'TEL;TYPE=HOME':
                            result.phone = value;
                            break;
                        case 'EMAIL':
                            result.email = value;
                            break;
                        case 'URL':
                            result.url = value;
                            break;
                        case 'ADR':
                            // Format address
                            const parts = value.split(';');
                            result.address = parts.filter(part => part).join(', ');
                            break;
                    }
                }
            }
            
            return result;
        }
        
        // Update status message
        function updateStatus(message, isError = false) {
            statusElement.textContent = message;
            
            if (isError) {
                statusElement.classList.add('error-message');
            } else {
                statusElement.classList.remove('error-message');
            }
        }
        
        // Reset the scanner to scan another QR code
        function resetScanner() {
            resultContainer.classList.remove('visible');
            contactInfo.innerHTML = '';
            vcardDisplay.textContent = '';
            startButton.disabled = false;
            
            // Reset status
            updateStatus('Press "Start Camera" to begin scanning');
        }
    </script>
</body>
</html>
